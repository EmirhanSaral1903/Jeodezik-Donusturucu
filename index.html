<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeodezik Açı Dönüştürücü</title>
    <style>
        :root {
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --radius: 8px;
            --input-bg: #ffffff;
            --panel-bg: #f8fafc;
        }
        body.dark-theme {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --primary: #38bdf8;
            --primary-hover: #0ea5e9;
            --input-bg: #0f172a;
            --panel-bg: #0f172a;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            transition: background-color 0.3s, color 0.3s;
        }
        .app-container {
            background: var(--bg-card);
            padding: 2rem;
            border-radius: var(--radius);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 540px;
            transition: background-color 0.3s;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }
        h2 {
            margin: 0;
            font-size: 1.25rem;
            color: var(--text-main);
        }
        .settings {
            display: flex;
            gap: 0.5rem;
        }
        select, .btn-icon {
            padding: 0.4rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.85rem;
            background: var(--input-bg);
            color: var(--text-main);
            cursor: pointer;
            transition: border-color 0.2s;
        }
        select:focus { outline: none; border-color: var(--primary); }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }
        label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }
        .input-wrapper {
            position: relative;
            display: flex;
        }
        input[type="number"] {
            width: 100%;
            padding: 0.6rem 2.5rem 0.6rem 0.6rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            background-color: var(--input-bg);
            color: var(--text-main);
            transition: border 0.2s;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: var(--primary);
        }
        .unit-label {
            position: absolute;
            right: 2.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.85rem;
            pointer-events: none;
        }
        .btn-copy {
            position: absolute;
            right: 0.2rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.4rem;
            font-size: 1rem;
            opacity: 0.6;
            transition: opacity 0.2s;
        }
        .btn-copy:hover { opacity: 1; }
        .dms-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0.5rem;
            background: var(--input-bg);
            padding: 1rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }
        .dms-container .input-wrapper input { padding-right: 1.5rem; }
        .dms-container .unit-label { right: 0.5rem; font-weight: bold; color: var(--text-main); }
        
        .actions {
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-bottom: 1rem;
        }
        .btn-primary {
            flex: 1;
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-primary:hover { background: var(--primary-hover); }
        .quadrant-display {
            flex: 1;
            text-align: center;
            background: rgba(2, 132, 199, 0.1);
            color: var(--primary);
            padding: 0.75rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            border: 1px solid rgba(2, 132, 199, 0.2);
        }

        .advanced-stats {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }
        .stat-item {
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            padding: 0.5rem;
            border-radius: 4px;
            border: 1px solid var(--border);
        }
        .stat-label { font-weight: 600; color: var(--text-muted); font-size: 0.75rem; margin-bottom: 0.2rem; }
        .stat-val { font-family: monospace; font-size: 0.9rem; color: var(--text-main); }
        
        .history-panel {
            border-top: 1px solid var(--border);
            padding-top: 1rem;
        }
        .history-list {
            list-style: none;
            padding: 0;
            margin: 0.5rem 0 0 0;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .history-item {
            background: var(--bg-body);
            padding: 0.5rem 0.75rem;
            border-radius: 4px;
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            color: var(--text-main);
        }
        .history-empty {
            color: var(--text-muted);
            text-align: center;
            font-style: italic;
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text-main);
            color: var(--bg-card);
            padding: 0.5rem 1.5rem;
            border-radius: 20px;
            font-size: 0.85rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        @media (max-width: 480px) {
            .grid-2, .advanced-stats { grid-template-columns: 1fr; }
            .actions { flex-direction: column; }
            .quadrant-display { width: 100%; box-sizing: border-box; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h2>Açı Dönüştürücü</h2>
        <div class="settings">
            <button class="btn-icon" id="theme-toggle" onclick="toggleTheme()" title="Gece/Gündüz Modu">🌙</button>
            <select id="precision" onchange="recalculate()" title="Ondalık Hassasiyet">
                <option value="2">.00</option>
                <option value="4" selected>.0000</option>
                <option value="6">.000000</option>
            </select>
            <button class="btn-icon" onclick="clearAllFocus()" title="Tümünü Temizle (Esc)">↺</button>
        </div>
    </div>
    
    <div class="grid-2">
        <div class="input-group">
            <label>Ondalık Derece</label>
            <div class="input-wrapper">
                <input type="number" id="deg" oninput="handleInput('deg')">
                <span class="unit-label">°</span>
                <button class="btn-copy" onclick="copyVal('deg')" title="Kopyala">📋</button>
            </div>
        </div>

        <div class="input-group">
            <label>Grad</label>
            <div class="input-wrapper">
                <input type="number" id="grad" oninput="handleInput('grad')">
                <span class="unit-label">g</span>
                <button class="btn-copy" onclick="copyVal('grad')" title="Kopyala">📋</button>
            </div>
        </div>

        <div class="input-group">
            <label>
                Radyan
                <span id="rad-pi" style="color:var(--primary); font-weight:normal;">0 π</span>
            </label>
            <div class="input-wrapper">
                <input type="number" id="rad" oninput="handleInput('rad')">
                <span class="unit-label">rad</span>
                <button class="btn-copy" onclick="copyVal('rad')" title="Kopyala">📋</button>
            </div>
        </div>

        <div class="input-group">
            <label>Milyem (NATO)</label>
            <div class="input-wrapper">
                <input type="number" id="mil" oninput="handleInput('mil')">
                <span class="unit-label">mil</span>
                <button class="btn-copy" onclick="copyVal('mil')" title="Kopyala">📋</button>
            </div>
        </div>
    </div>

    <label style="margin-bottom:0.5rem; display:block;">Derece Dakika Saniye (DMS)</label>
    <div class="dms-container">
        <div class="input-wrapper">
            <input type="number" id="dms_d" oninput="handleInput('dms')">
            <span class="unit-label">°</span>
        </div>
        <div class="input-wrapper">
            <input type="number" id="dms_m" oninput="handleInput('dms')">
            <span class="unit-label">'</span>
        </div>
        <div class="input-wrapper">
            <input type="number" id="dms_s" oninput="handleInput('dms')">
            <span class="unit-label">"</span>
        </div>
    </div>
    
    <div class="actions">
        <button class="btn-primary" onclick="calculateReverseAzimuth()">Ters Semt Hesapla</button>
        <div class="quadrant-display" id="quadrant">Bölge: -</div>
    </div>

    <div class="advanced-stats" id="advanced-stats">
        <div class="stat-item">
            <span class="stat-label">Yönleme Açısı (Semt)</span>
            <span class="stat-val" id="stat-bearing">-</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Sapma Açısı (180°'den)</span>
            <span class="stat-val" id="stat-deflect">-</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Trigonometrik Çarpanlar</span>
            <span class="stat-val" id="stat-trig">-</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Grad Alt Birimleri</span>
            <span class="stat-val" id="stat-centesimal">-</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Arazi Eğim Yüzdesi (Tan)</span>
            <span class="stat-val" id="stat-slope">-</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">İrtifa / Zenith Açısı</span>
            <span class="stat-val" id="stat-zenith">-</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Zaman Açısı</span>
            <span class="stat-val" id="stat-hour">-</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Dünya Yay Uzunluğu (R≈6371)</span>
            <span class="stat-val" id="stat-arc">-</span>
        </div>
    </div>

    <div class="history-panel">
        <label>
            Geçmiş İşlemler
            <span style="color:var(--primary); cursor:pointer; font-weight:normal;" onclick="clearHistory()">Temizle</span>
        </label>
        <ul class="history-list" id="history-list">
            <li class="history-empty">Henüz kayıt yok. (Kopyaladığınızda eklenir)</li>
        </ul>
    </div>
</div>

<div id="toast" class="toast">Kopyalandı!</div>

<script>
    const inputs = {
        deg: document.getElementById('deg'),
        grad: document.getElementById('grad'),
        rad: document.getElementById('rad'),
        mil: document.getElementById('mil'),
        dms_d: document.getElementById('dms_d'),
        dms_m: document.getElementById('dms_m'),
        dms_s: document.getElementById('dms_s')
    };
    
    let currentBaseDegree = NaN;
    let historyData = [];

    // Kısayol: Esc ile temizle
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') clearAllFocus();
    });

    function toggleTheme() {
        document.body.classList.toggle('dark-theme');
        const btn = document.getElementById('theme-toggle');
        btn.innerText = document.body.classList.contains('dark-theme') ? '☀️' : '🌙';
    }

    function getPrecision() { return parseInt(document.getElementById('precision').value); }

    function normalizeAngle(value, max) {
        let mod = value % max;
        if (mod < 0) mod += max;
        return mod;
    }

    function determineQuadrant(deg) {
        if (isNaN(deg)) return "-";
        if (deg === 0 || deg === 360) return "Kuzey Eksen";
        if (deg === 90) return "Doğu Eksen";
        if (deg === 180) return "Güney Eksen";
        if (deg === 270) return "Batı Eksen";
        
        if (deg > 0 && deg < 90) return "I. Bölge";
        if (deg > 90 && deg < 180) return "II. Bölge";
        if (deg > 180 && deg < 270) return "III. Bölge";
        if (deg > 270 && deg < 360) return "IV. Bölge";
        return "-";
    }

    function updateAllFields(baseDegree) {
        currentBaseDegree = baseDegree;
        const p = getPrecision();
        const quadEl = document.getElementById('quadrant');
        const radPiEl = document.getElementById('rad-pi');
        const advStats = document.getElementById('advanced-stats');

        if (isNaN(baseDegree)) {
            Object.values(inputs).forEach(input => input.value = '');
            quadEl.innerText = "Bölge: -";
            radPiEl.innerText = "0 π";
            advStats.style.display = 'none';
            return;
        }

        let normDeg = normalizeAngle(baseDegree, 360);
        let radVal = normDeg * Math.PI / 180;
        
        quadEl.innerText = "Bölge: " + determineQuadrant(normDeg);
        radPiEl.innerText = (normDeg / 180).toFixed(4) + " π";

        inputs.deg.value = parseFloat(normDeg.toFixed(p));
        inputs.grad.value = parseFloat((normDeg * (200 / 180)).toFixed(p));
        inputs.rad.value = parseFloat((normDeg * (Math.PI / 180)).toFixed(p));
        inputs.mil.value = parseFloat((normDeg * (6400 / 360)).toFixed(p));

        let d = Math.floor(normDeg);
        let minFloat = (normDeg - d) * 60;
        let m = Math.floor(minFloat);
        let s = (minFloat - m) * 60;

        inputs.dms_d.value = d;
        inputs.dms_m.value = m;
        inputs.dms_s.value = parseFloat(s.toFixed(2)); 

        // Gelişmiş İstatistikler Göster
        advStats.style.display = 'grid';
        
        // 1. Yönleme Açısı (Bearing)
        let bearing = "";
        if (normDeg === 0 || normDeg === 360) bearing = "Kuzey (0°)";
        else if (normDeg === 90) bearing = "Doğu (90°)";
        else if (normDeg === 180) bearing = "Güney (0°)";
        else if (normDeg === 270) bearing = "Batı (90°)";
        else if (normDeg > 0 && normDeg < 90) bearing = `K ${normDeg.toFixed(p)}° D`;
        else if (normDeg > 90 && normDeg < 180) bearing = `G ${(180 - normDeg).toFixed(p)}° D`;
        else if (normDeg > 180 && normDeg < 270) bearing = `G ${(normDeg - 180).toFixed(p)}° B`;
        else if (normDeg > 270 && normDeg < 360) bearing = `K ${(360 - normDeg).toFixed(p)}° B`;
        document.getElementById('stat-bearing').innerText = bearing;

        // 2. Sapma Açısı (Deflection)
        let deflect = "";
        if (normDeg === 180) deflect = "Sapma Yok (0°)";
        else if (normDeg < 180) deflect = `Sola ${(180 - normDeg).toFixed(p)}°`;
        else deflect = `Sağa ${(normDeg - 180).toFixed(p)}°`;
        document.getElementById('stat-deflect').innerText = deflect;

        // 3. Trigonometrik (Sin/Cos)
        let sinVal = Math.sin(radVal).toFixed(p);
        let cosVal = Math.cos(radVal).toFixed(p);
        document.getElementById('stat-trig').innerText = `Sin: ${sinVal} | Cos: ${cosVal}`;

        // 4. Grad Alt Birimleri (c, cc)
        let totalGrad = normDeg * (200 / 180);
        let gInt = Math.floor(totalGrad);
        let cFloat = (totalGrad - gInt) * 100;
        let cInt = Math.floor(cFloat);
        let ccFloat = (cFloat - cInt) * 100;
        document.getElementById('stat-centesimal').innerText = `${gInt}g ${cInt}c ${ccFloat.toFixed(0)}cc`;

        // 5. Eğim (%)
        if (normDeg === 90 || normDeg === 270) {
            document.getElementById('stat-slope').innerText = "Tanımsız (∞)";
        } else {
            let slope = Math.tan(radVal) * 100;
            document.getElementById('stat-slope').innerText = "% " + slope.toFixed(2);
        }

        // 6. İrtifa (Zenith)
        let altitude = 90 - normDeg;
        document.getElementById('stat-zenith').innerText = altitude.toFixed(p) + "°";

        // 7. Zaman Açısı
        let totalSecs = (normDeg / 15) * 3600;
        let tH = Math.floor(totalSecs / 3600);
        let tM = Math.floor((totalSecs % 3600) / 60);
        let tS = totalSecs % 60;
        document.getElementById('stat-hour').innerText = `${tH}h ${tM}m ${tS.toFixed(2)}s`;

        // 8. Yay Uzunluğu (R = 6371 km)
        let arc = radVal * 6371;
        document.getElementById('stat-arc').innerText = arc.toFixed(2) + " km";
    }

    function handleInput(source) {
        let val;
        switch (source) {
            case 'deg':
                val = parseFloat(inputs.deg.value);
                if (inputs.deg.value === '') return updateAllFields(NaN);
                if (!isNaN(val)) updateAllFields(val);
                break;
            case 'grad':
                val = parseFloat(inputs.grad.value);
                if (inputs.grad.value === '') return updateAllFields(NaN);
                if (!isNaN(val)) updateAllFields(val * (180 / 200));
                break;
            case 'rad':
                val = parseFloat(inputs.rad.value);
                if (inputs.rad.value === '') return updateAllFields(NaN);
                if (!isNaN(val)) updateAllFields(val * (180 / Math.PI));
                break;
            case 'mil':
                val = parseFloat(inputs.mil.value);
                if (inputs.mil.value === '') return updateAllFields(NaN);
                if (!isNaN(val)) updateAllFields(val * (360 / 6400));
                break;
            case 'dms':
                let d = parseFloat(inputs.dms_d.value) || 0;
                let m = parseFloat(inputs.dms_m.value) || 0;
                let s = parseFloat(inputs.dms_s.value) || 0;
                if (inputs.dms_d.value === '' && inputs.dms_m.value === '' && inputs.dms_s.value === '') {
                    return updateAllFields(NaN);
                }
                updateAllFields(d + (m / 60) + (s / 3600));
                break;
        }
    }

    function recalculate() { if (!isNaN(currentBaseDegree)) updateAllFields(currentBaseDegree); }
    
    function clearAllFocus() { 
        updateAllFields(NaN); 
        document.getElementById('deg').focus();
    }

    function renderHistory() {
        const hl = document.getElementById('history-list');
        if (historyData.length === 0) {
            hl.innerHTML = '<li class="history-empty">Henüz kayıt yok. (Kopyaladığınızda eklenir)</li>';
            return;
        }
        hl.innerHTML = historyData.map(item => 
            `<li class="history-item">
                <span><strong>${item.deg}°</strong> = ${item.grad}g</span>
                <span style="color:var(--text-muted); font-size:0.75rem;">${item.label}</span>
            </li>`
        ).join('');
    }

    function addToHistory(degVal, label) {
        if (isNaN(degVal)) return;
        const p = getPrecision();
        historyData.unshift({
            deg: normalizeAngle(degVal, 360).toFixed(p),
            grad: (normalizeAngle(degVal, 360) * (200 / 180)).toFixed(p),
            label: label
        });
        if (historyData.length > 3) historyData.pop();
        renderHistory();
    }

    function clearHistory() { historyData = []; renderHistory(); }

    function calculateReverseAzimuth() {
        if (isNaN(currentBaseDegree)) return;
        let newDeg = currentBaseDegree < 180 ? currentBaseDegree + 180 : currentBaseDegree - 180;
        updateAllFields(newDeg);
        addToHistory(newDeg, "Ters Semt");
    }

    function copyVal(elementId) {
        const val = document.getElementById(elementId).value;
        if (!val) return;
        navigator.clipboard.writeText(val).then(() => {
            const toast = document.getElementById('toast');
            toast.style.opacity = '1';
            setTimeout(() => toast.style.opacity = '0', 2000);
            addToHistory(currentBaseDegree, "Kopyalandı");
        });
    }
</script>

</body>
</html>
