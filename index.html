<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeodezik Açı Dönüştürücü</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e9ecef;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 1.5rem;
        }
        .input-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #495057;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #4dabf7;
            box-shadow: 0 0 0 3px rgba(77,171,247,0.2);
        }
        .error {
            color: #fa5252;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Açı Dönüştürücü</h2>
    
    <div class="input-group">
        <label for="degree">Derece (°)</label>
        <input type="number" id="degree" placeholder="Örn: 90" oninput="calculateFromDegree()">
    </div>

    <div class="input-group">
        <label for="grad">Grad (g)</label>
        <input type="number" id="grad" placeholder="Örn: 100" oninput="calculateFromGrad()">
    </div>

    <div class="input-group">
        <label for="radian">Radyan (rad)</label>
        <input type="number" id="radian" placeholder="Örn: 1.5708" oninput="calculateFromRadian()">
    </div>
    
    <div id="errorMessage" class="error">Lütfen geçerli bir sayı giriniz.</div>
</div>

<script>
    const degreeInput = document.getElementById('degree');
    const gradInput = document.getElementById('grad');
    const radianInput = document.getElementById('radian');
    const errorMsg = document.getElementById('errorMessage');

    function clearInputs() {
        degreeInput.value = '';
        gradInput.value = '';
        radianInput.value = '';
        errorMsg.style.display = 'none';
    }

    // Açıları ana çembere (0 ile max arası) indirgeyen fonksiyon
    function normalizeAngle(value, max) {
        let mod = value % max;
        if (mod < 0) {
            mod += max;
        }
        return mod;
    }

    function calculateFromDegree() {
        let deg = parseFloat(degreeInput.value);
        if (degreeInput.value === '') return clearInputs();
        if (isNaN(deg)) {
            errorMsg.style.display = 'block';
            return;
        }
        errorMsg.style.display = 'none';

        // 360'tan büyükse veya negatifse ana açıya çevir
        if (deg >= 360 || deg < 0) {
            deg = normalizeAngle(deg, 360);
            degreeInput.value = parseFloat(deg.toFixed(4));
        }

        gradInput.value = (deg * (200 / 180)).toFixed(4);
        radianInput.value = (deg * (Math.PI / 180)).toFixed(4);
    }

    function calculateFromGrad() {
        let grad = parseFloat(gradInput.value);
        if (gradInput.value === '') return clearInputs();
        if (isNaN(grad)) {
            errorMsg.style.display = 'block';
            return;
        }
        errorMsg.style.display = 'none';

        // 400'den büyükse veya negatifse ana açıya çevir
        if (grad >= 400 || grad < 0) {
            grad = normalizeAngle(grad, 400);
            gradInput.value = parseFloat(grad.toFixed(4));
        }

        degreeInput.value = (grad * (180 / 200)).toFixed(4);
        radianInput.value = (grad * (Math.PI / 200)).toFixed(4);
    }

    function calculateFromRadian() {
        let rad = parseFloat(radianInput.value);
        if (radianInput.value === '') return clearInputs();
        if (isNaN(rad)) {
            errorMsg.style.display = 'block';
            return;
        }
        errorMsg.style.display = 'none';

        const maxRad = 2 * Math.PI;
        // 2π'den büyükse veya negatifse ana açıya çevir
        if (rad >= maxRad || rad < 0) {
            rad = normalizeAngle(rad, maxRad);
            radianInput.value = parseFloat(rad.toFixed(4));
        }

        degreeInput.value = (rad * (180 / Math.PI)).toFixed(4);
        gradInput.value = (rad * (200 / Math.PI)).toFixed(4);
    }
</script>

</body>
</html>
